name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        run: cargo install cross --locked || true
      - name: Build (portable; NO target-cpu=native in release artifacts)
        run: |
          if command -v cross >/dev/null 2>&1; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Collect binaries
        run: |
          mkdir -p dist
          for b in freespoof freespoof-client freespoof-server; do
            cp "target/${{ matrix.target }}/release/$b" "dist/$b-${{ matrix.target }}" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: freespoof-${{ matrix.target }}
          path: dist/*

  # Optional: a native-optimized build (AVX2/AVX-512). NOT used for release
  # artifacts because target-cpu=native is not portable across machines.
  native-build:
    name: native-optimized build (non-artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with target-cpu=native
        env:
          RUSTFLAGS: "-C target-cpu=native"
        run: cargo build --release

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, cross-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -l release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
