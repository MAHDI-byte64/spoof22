# =============================================================================
# freespoof — فایل کانفیگ نمونه‌ی سمت کلاینت (role = "client")
# =============================================================================
# این فایل آینه‌ی config/server.toml است: نقش‌ها و آدرس‌ها جابه‌جا شده‌اند اما
# انتقال‌ها، پورت‌ها، psk، aead و تنظیمات obfs باید در هر دو طرف یکسان بمانند.
# نام کلیدها و واژه‌های پروتکل انگلیسی‌اند؛ فقط توضیحات فارسی است.
#
# ساده‌ترین راه ساخت این فایل: روی سرور دستور زیر را بزنید تا به‌طور خودکار
# ساخته و لینک اشتراک base64 تولید شود:
#     freespoof pair --server-config /etc/freespoof/server.toml --client-out client.toml
# سپس کلید عمومی کلاینت (که pair چاپ می‌کند) را در سرور به peer_public_key یا
# spoof.allowed_peers اضافه کنید.
#
# پیش‌نیاز اجرا: Linux با CAP_NET_RAW + CAP_NET_ADMIN
#   (setcap cap_net_raw,cap_net_admin+ep /usr/local/bin/freespoof  یا اجرا با root)
# =============================================================================

# نقش این پردازه: برای کلاینت حتماً "client". با سوییچ --role هم قابل بازنویسی است.
role = "client"

# سطح لاگ. یکی از: trace | debug | info | warn | error
log_level = "info"

# نسخه‌ی پروتکل روی سیم. اطلاعاتی است؛ موتور آن را به نسخه‌ی این باینری (۱) قفل
# می‌کند و باید با طرف مقابل سازگار باشد.
protocol_version = 1


# -----------------------------------------------------------------------------
# [spoof] — جعل IP و آدرس‌دهی  (نسبت به سرور آینه‌وار است)
# -----------------------------------------------------------------------------
[spoof]
# آدرس واقعی همین میزبان (کلاینت) روی NIC. در سرور این همان peer_real_ip است.
real_ip = "198.51.100.20"

# آدرس واقعی طرف مقابل (سرور). بسته‌ها همیشه به این مقصد ارسال می‌شوند.
# باید با real_ip فرق داشته باشد.
peer_real_ip = "203.0.113.10"

# آدرس مبدأِ جعلی که روی بسته‌های خروجی خام حک می‌شود.
# در حالت پیش‌فرض (no_spoof = true) اعتبارسنج آن را برابرِ real_ip قرار می‌دهد.
#
# نمونه‌ی فعال‌کردن جعل (به‌جای دو خط زیر):  no_spoof = false  و:
#   spoofed_ip      = "198.51.100.200"  # مبدأ جعلیِ خودمان
#   peer_spoofed_ip = "203.0.113.200"   # مبدأ جعلی‌ای که از سرور انتظار داریم
# دقت کنید این دو نسبت به فایلِ سرور آینه‌وار جابه‌جا شده‌اند.
spoofed_ip = "198.51.100.20"

# مبدأ جعلیِ طرف مقابل که انتظار داریم ببینیم (هرگز به‌تنهایی اعتماد نمی‌شود).
# در حالت no_spoof برابرِ peer_real_ip می‌شود.
peer_spoofed_ip = "203.0.113.10"

# فهرست همتایانِ مجاز به‌صورت کلید عمومی X25519 با کدگذاری hex (۳۲ بایت).
# خالی = هر همتایی که handshake را با کلید پیکربندی‌شده بگذراند پذیرفته می‌شود.
# (توجه: این‌جا hex است، ولی crypto.peer_public_key با base64 است.)
allowed_peers = []

# استخر مبدأهای جعلی برای چرخش per-session. خالی = فقط spoofed_ip.
# فقط وقتی no_spoof = false معنا دارد. مثال: ["198.51.100.201", "198.51.100.202"]
spoofed_ip_pool = []

# با true جعل خاموش می‌شود (برای شروعِ امن پیش‌فرض true است). برای فعال‌کردن جعل،
# این را false کنید و spoofed_ip/peer_spoofed_ip را مطابق نمونه‌ی بالا پر کنید.
no_spoof = true


# -----------------------------------------------------------------------------
# [transport] — انتقال‌های روی سیم و انتخاب نقطه‌ی اتصال
# این مقادیر باید با سرور یکسان باشند (به‌جز server_endpoints که سمت کلاینت است).
# -----------------------------------------------------------------------------
[transport]
# کارت شبکه‌ی فیزیکی که سوکت خام به آن bind می‌شود (مثلاً eth0).
interface = "eth0"

# انتقال مسیر بالارو (client → server). باید با سرور یکسان باشد.
#   udp | icmp | proto58 | tcp | quic | ipip | gre
uplink_protocol = "udp"

# انتقال مسیر پایین‌رو (server → client). باید با سرور یکسان باشد.
downlink_protocol = "udp"

# پورت L4 برای udp/tcp/quic. باید با سرور یکسان باشد.
data_port = 51820

# چرخاندن پورت داده (فقط udp/tcp، هرگز با quic). پیش‌فرض خاموش.
shuffle_data_port = false

# کف و سقف بازه‌ی پورت هنگام shuffle.
shuffle_port_min = 20000
shuffle_port_max = 60000

# شناسه‌ی ICMP Echo برای انتقال icmp. (۴۶۶۰ معادل 0x1234 است.)
icmp_id = 4660

# تصادفی‌کردن icmp_id در هر نشست.
randomize_icmp_id = true

# نقاط اتصال سرور که کلاینت به آن‌ها وصل می‌شود (ip:port). اولی اصلی است.
# خالی = از peer_real_ip:data_port ساخته می‌شود. برای کلاینت معمولاً آدرس سرور را
# این‌جا می‌گذاریم.
server_endpoints = ["203.0.113.10:51820"]

# فاصله‌ی ثانیه‌ای بین hopِ نقطه/پورت (۰ = خاموش). برای >۰ حداقل دو
# server_endpoints لازم است، مثلاً:
#   server_endpoints = ["203.0.113.10:51820", "203.0.113.11:51820"]
#   endpoint_hop_interval_secs = 60
endpoint_hop_interval_secs = 0

# مسابقه‌ی همه‌ی انتقال‌ها هنگام شروع و نگه‌داشتن سریع‌ترین.
transport_racing = false

# فهرست مرتب failover. مثال: ["icmp", "tcp"]
failover_order = []


# -----------------------------------------------------------------------------
# [crypto] — handshake، AEAD، rekey، پساکوانتومی
# aead/pq_hybrid/pq_level/pre_shared_key باید با سرور یکسان باشند.
# -----------------------------------------------------------------------------
[crypto]
# کلید خصوصی استاتیک Noise (X25519) همین کلاینت، base64. با `freespoof genkey`
# بسازید. خالی‌ماندن خطا می‌دهد.
static_private_key = "<RUN: freespoof genkey>"

# کلید عمومی استاتیک همین کلاینت، base64 (اطلاعاتی). این کلید را به
# peer_public_key فایلِ سرور (یا spoof.allowed_peers به‌صورت hex) بدهید.
static_public_key = "<RUN: freespoof genkey>"

# کلید عمومی استاتیک طرف مقابل (سرور)، base64 — برای Noise_IK لازم است.
# این مقدار را از static_public_key فایلِ سرور کپی کنید.
peer_public_key = "<RUN: freespoof genkey  (کلید عمومی سرور)>"

# PSK اختیاری (سبک WireGuard / IKpsk2). اگر تنظیم شود باید دقیقاً با سرور یکسان
# باشد. خالی = بدون PSK.
pre_shared_key = ""

# AEAD هر فریم. یکی از: chacha20_poly1305 | aes256_gcm — باید با سرور یکسان باشد.
aead = "chacha20_poly1305"

# انتخاب خودکار aes256_gcm وقتی CPU از AES-NI پشتیبانی می‌کند.
aead_auto_hardware = true

# فعال‌کردن handshake ترکیبیِ پساکوانتومی X25519 + ML-KEM (باید با سرور یکسان).
pq_hybrid = true

# مجموعه‌پارامتر ML-KEM. یکی از: ml_kem512 | ml_kem768 | ml_kem1024
pq_level = "ml_kem768"

# rekey بعد از این تعداد بایت (۰ = خاموش). پیش‌فرض ۶۴ گیبی‌بایت.
rekey_bytes = 68719476736

# rekey بعد از این تعداد ثانیه (۰ = خاموش). باید ۰ یا >=۱۰ باشد.
rekey_secs = 3600

# پهنای پنجره‌ی ضدبازپخش بر حسب فریم. باید مضربی از ۶۴ و >=۶۴ باشد.
replay_window = 2048


# -----------------------------------------------------------------------------
# [tun] — دستگاه TUN، مسیریابی، NAT و فایروال
# tun_ip و tun_peer_ip نسبت به سرور جابه‌جا شده‌اند.
# -----------------------------------------------------------------------------
[tun]
# نام رابط TUN (حداکثر ۱۵ کاراکتر).
tun_name = "freespoof0"

# آدرس TUN این طرف. در سرور 10.66.0.1 بود؛ این‌جا 10.66.0.2 است.
tun_ip = "10.66.0.2"

# آدرس TUN طرف مقابل (سرور).
tun_peer_ip = "10.66.0.1"

# نت‌ماسک TUN (لینک نقطه‌به‌نقطه از /30 استفاده می‌کند).
tun_netmask = "255.255.255.252"

# MTU داخلی روی دستگاه TUN؛ به [perf].mtu کلمپ می‌شود. حداقل ۵۷۶.
tun_mtu = 1380

# پورت‌هایی که به tun_peer_ip ترجمه/فوروارد می‌شوند. خالی = همه‌ی پورت‌ها.
forward_ports = []

# حالت مسیریابی: full (همه‌ی ترافیک از تونل) یا split.
# برای کلاینتی که فقط می‌خواهد بخشی از ترافیک را تونل کند، "split" و CIDRها را
# تنظیم کنید.
routing_mode = "full"

# CIDRهای حالت split. مثال: ["0.0.0.0/0"] برای همه، یا ["10.0.0.0/8"].
split_cidrs = []

# پورت‌های حالت split.
split_ports = []

# DNSهایی که برای تونل push/override می‌شوند.
dns_servers = ["1.1.1.1", "9.9.9.9"]

# حل نام‌ها روی DoH/DoT.
dns_over_https = false

# نصب kill switch تا با افتادن تونل، ترافیک از روی NIC نشت نکند.
kill_switch = true


# -----------------------------------------------------------------------------
# [obfs] — مبهم‌سازی در برابر DPI، تقلید و شکل‌دهی ترافیک
# مقادیر زیر باید با سرور یکسان باشند (به‌ویژه ttl_jitter و random_dscp و اثرانگشت).
# -----------------------------------------------------------------------------
[obfs]
# حداقل بایت padding تصادفی هر فریم (۰ = خاموش).
packet_padding = 0

# سقف padding تصادفی (در هر فریم عددی در بازه‌ی ۱..=max انتخاب می‌شود).
packet_padding_max = 64

# مقادیر TTL تصادفیِ per-packet (باید در دو طرف یکسان و همگی غیرصفر باشند).
ttl_jitter = [64, 128, 255]

# افزودن هدر جعلیِ ۵ بایتیِ TLS Application-Data روی انتقال tcp.
fake_tls_header = false

# کدهای DSCP تصادفیِ per-packet. (0 و 40 و 16 معادل 0x00/0x28/0x10)
random_dscp = [0, 40, 16]

# سقف jitter زمان‌بندی بین بسته‌ها (میلی‌ثانیه، ۰ = خاموش).
timing_jitter_ms = 0

# شکل‌دهی با نرخ ثابت (packets per second، ۰ = خاموش).
constant_rate_pps = 0

# پر کردن هر فریم تا این اندازه‌ی ثابت (۰ = خاموش). اگر >۰ باشد باید >=۶۴.
pad_to_size = 0

# نمای تقلید. یکی از: none | http2 | http3 | doh | web_socket | video_stream
mimicry_profile = "none"

# اثرانگشت TLS برای tcp/quic. یکی از: chrome | firefox | safari | native
tls_fingerprint = "chrome"

# SNI که انتقال‌های tcp/quic ارائه می‌کنند (باید با سرور هماهنگ باشد).
sni = "www.cloudflare.com"

# استفاده از Encrypted Client Hello برای پنهان‌کردن SNI واقعی.
ech = false

# ترافیک پوششی/chaff (packets per second، ۰ = خاموش).
cover_traffic_pps = 0

# طعمه در برابر کاوش فعال — معمولاً سمت سرور فعال می‌شود؛ در کلاینت خاموش.
decoy_enabled = false

# مقصد بالادستِ طعمه (host:port). وقتی decoy_enabled = true لازم است.
decoy_target = "www.cloudflare.com:443"

# آدرس گوش‌دادن پراکسیِ طعمه (سمت سرور). در کلاینت معمولاً خالی.
decoy_listen = ""


# -----------------------------------------------------------------------------
# [mux] — دسته‌بندی بسته‌ها (فقط udp/icmp/proto58/ipip)
# -----------------------------------------------------------------------------
[mux]
enable_multiplex = false
multiplex_flush_ms = 1
# اگر enable_multiplex روشن باشد باید >=۲۵۶.
multiplex_max_payload = 1200


# -----------------------------------------------------------------------------
# [fec] — تصحیح خطای رو به جلو (فقط udp/icmp/proto58/ipip)
# -----------------------------------------------------------------------------
[fec]
enable_fec = false
# تعداد shardهای داده در هر گروه (>=۲).
fec_group_size = 8
# یکی از: xor | reed_solomon
fec_mode = "reed_solomon"
fec_adaptive = true
# تعداد shardهای پاریتی reed_solomon (>=۱؛ data+parity <= ۲۵۵).
fec_parity_shards = 2


# -----------------------------------------------------------------------------
# [perf] — موازی‌سازی، تنظیم خودکار و بافرها
# -----------------------------------------------------------------------------
[perf]
# تعداد تونل‌های موازی (با auto_tune بازنویسی می‌شود؛ اگر auto_tune=false باید >=۱).
tunnel_count = 4
# تنظیم خودکار بر پایه‌ی CPU/RAM/NIC.
auto_tune = true
# یکی از: throughput | latency | balanced
perf_mode = "balanced"
# MTU مؤثر موتور. بازه‌ی ۵۷۶..=۹۰۰۰.
mtu = 1380
# ظرفیت کانال‌های داخلی (غیرصفر).
channel_capacity = 1024
io_channel_capacity = 2048
# نخ‌های کارگر Tokio (۰ = خودکار).
runtime_worker_threads = 0
# پین‌کردن نخ‌ها به CPU (بهترین تلاش).
cpu_pinning = false
# backend نوع io_uring در صورت وجود (بهترین تلاش).
io_uring = false


# -----------------------------------------------------------------------------
# [reliability] — کنترل ازدحام، keepalive، migration و اتصال مجدد
# -----------------------------------------------------------------------------
[reliability]
# یکی از: bbr | aimd | none
congestion = "bbr"
# فاصله‌ی keepalive (ثانیه، ۰ = خاموش).
keepalive_secs = 15
# اعلام مرگ همتا پس از این ثانیه بدون ترافیک.
dead_peer_timeout_secs = 60
# اتصال مجدد خودکار با backoff نمایی.
auto_reconnect = true
reconnect_backoff_min_ms = 500
reconnect_backoff_max_ms = 30000
# بقا در برابر تغییر IP کلاینت (Wi-Fi <-> cellular). برای کلاینت موبایل مفید است.
enable_migration = true


# -----------------------------------------------------------------------------
# [observability] — متریک، سوکت کنترل و لاگ‌ها
# -----------------------------------------------------------------------------
[observability]
# آدرس Prometheus روی /metrics (خالی = غیرفعال). محدود به localhost.
metrics_addr = "127.0.0.1:9100"
# آدرس سلامت روی /health (خالی = غیرفعال).
health_addr = "127.0.0.1:9101"
# سوکت یونیکسِ کنترل برای `freespoof ctl` (خالی = غیرفعال).
control_socket = "/run/freespoof.sock"
# لاگ‌های ساخت‌یافته‌ی JSON در کنار لاگ‌های خوانا.
json_logs = false
# محدودیت نرخ handshake (سمت سرور استفاده می‌شود؛ در کلاینت بی‌اثر است).
handshake_rate_limit = 30


# -----------------------------------------------------------------------------
# [quic] — تنظیمات ویژه‌ی انتقال QUIC (فقط وقتی uplink/downlink = quic)
# QUIC با جعل IP ترکیب نمی‌شود؛ برای QUIC باید spoof.no_spoof = true باشد.
# cert_path/key_path سمت سرور استفاده می‌شوند؛ کلاینت server_name را اعتبارسنجی می‌کند.
# -----------------------------------------------------------------------------
[quic]
# مسیر گواهی PEM (سمت سرور؛ در کلاینت بی‌اثر). اگر نبود، به‌طور خودکار موقتی ساخته می‌شود.
cert_path = "/etc/freespoof/quic-cert.pem"
# مسیر کلید خصوصی PEM (سمت سرور).
key_path = "/etc/freespoof/quic-key.pem"
# نام سروری که کلاینت اعتبارسنجی می‌کند (باید با server_name سرور یکی باشد).
server_name = "www.cloudflare.com"
# پنجره‌ی کنترل جریان در سطح اتصال (بایت). پیش‌فرض ۱۲۸ مگابایت.
connection_window = 134217728
# پنجره‌ی کنترل جریان در سطح هر stream (بایت). پیش‌فرض ۱۶ مگابایت.
stream_window = 16777216


# -----------------------------------------------------------------------------
# [hardening] — افت امتیاز (privilege drop) و sandbox
# -----------------------------------------------------------------------------
[hardening]
# افت به این کاربر پس از راه‌اندازی (خالی = بدون افت). مثال: "freespoof"
run_as_user = ""
# افت به این گروه (خالی = از روی کاربر استنتاج می‌شود).
run_as_group = ""
# اعمال sandbox سیستم‌فایل با Landlock پس از init (بهترین تلاش). هسته‌ی فاقد
# Landlock فقط log و رد می‌شود (fatal نیست).
sandbox = false
# نصب deny-list فراخوان‌های سیستمی با seccomp-bpf پس از افت امتیاز (بهترین تلاش).
# فراخوان‌های خطرناک با EPERM رد می‌شوند؛ هرگز پروسه را نمی‌کشد.
seccomp = false
