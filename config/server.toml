# =============================================================================
# freespoof — فایل کانفیگ نمونه‌ی سمت سرور (role = "server")
# =============================================================================
# این فایل یک قالب کامل است: هر گزینه با توضیح فارسی همراه شده و مقدارِ
# نمونه‌ی واقعی دارد. نام کلیدها (keys) و واژه‌های پروتکل به انگلیسی می‌مانند؛
# فقط توضیحات فارسی است.
#
# نحوه‌ی استفاده:
#   1) با `freespoof genkey` یک جفت‌کلید بسازید و مقادیر static_private_key/
#      static_public_key را این‌جا و peer_public_key را از روی کلید عمومی کلاینت
#      پر کنید (و بالعکس در فایل کلاینت).
#   2) آدرس‌های real_ip / peer_real_ip و tun_ip / tun_peer_ip را مطابق شبکه‌ی
#      خود تنظیم کنید. سرور و کلاینت باید آینه‌ی هم باشند (جای tun_ip و
#      tun_peer_ip و نیز real/peer_real با هم عوض می‌شود).
#   3) این فایل را در مسیر /etc/freespoof/<instance>.toml بگذارید و با
#      systemd unit به نام freespoof@<instance>.service اجرا کنید.
#
# پیش‌نیاز اجرا: Linux با CAP_NET_RAW + CAP_NET_ADMIN
#   (setcap cap_net_raw,cap_net_admin+ep /usr/local/bin/freespoof  یا اجرا با root)
# =============================================================================

# نقش این پردازه: برای سرور حتماً "server". با سوییچ --role هم قابل بازنویسی است.
role = "server"

# سطح لاگ. یکی از: trace | debug | info | warn | error
log_level = "info"

# نسخه‌ی پروتکل روی سیم. اطلاعاتی است؛ موتور آن را به نسخه‌ی این باینری (۱) قفل
# می‌کند. هر دو طرف باید نسخه‌ی سازگار داشته باشند.
protocol_version = 1


# -----------------------------------------------------------------------------
# [spoof] — جعل IP و آدرس‌دهی
# -----------------------------------------------------------------------------
[spoof]
# آدرس واقعی همین میزبان روی کارت شبکه‌ی فیزیکی (NIC). حتماً باید تنظیم شود.
real_ip = "203.0.113.10"

# آدرس واقعی طرف مقابل (کلاینت). بسته‌ها همیشه به این مقصد ارسال می‌شوند تا
# پاسخ‌ها به طرف واقعی برسند؛ هویت طرف به‌صورت رمزنگاری‌شده تأیید می‌شود.
# باید با real_ip فرق داشته باشد.
peer_real_ip = "198.51.100.20"

# آدرس مبدأِ جعلی که روی بسته‌های خروجی خام حک می‌شود.
# در حالت پیش‌فرض (no_spoof = true) اعتبارسنج آن را برابرِ real_ip قرار می‌دهد،
# پس این‌جا همان real_ip را گذاشته‌ایم تا امن باشد.
#
# نمونه‌ی فعال‌کردن جعل (به‌جای دو خط زیر):  no_spoof = false  و:
#   spoofed_ip      = "203.0.113.200"   # مبدأ جعلیِ خودمان
#   peer_spoofed_ip = "198.51.100.200"  # مبدأ جعلی‌ای که از کلاینت انتظار داریم
# توجه: در فایل کلاینت این دو مقدار باید آینه‌وار جابه‌جا شوند.
spoofed_ip = "203.0.113.10"

# مبدأ جعلیِ طرف مقابل که انتظار داریم ببینیم (هرگز به‌تنهایی اعتماد نمی‌شود).
# در حالت no_spoof برابرِ peer_real_ip می‌شود.
peer_spoofed_ip = "198.51.100.20"

# فهرست همتایانِ مجاز به‌صورت کلید عمومی استاتیک X25519 با کدگذاری hex (۳۲ بایت).
# خالی = هر همتایی که handshake را با کلید پیکربندی‌شده بگذراند پذیرفته می‌شود.
# توجه: این‌جا hex است، ولی crypto.peer_public_key با base64 است.
# مثال افزودن کلاینت:  allowed_peers = ["<hex 64 رقمی کلید عمومی کلاینت>"]
allowed_peers = []

# استخر مبدأهای جعلی که در هر نشست به‌نوبت استفاده می‌شوند تا الگوی ترافیک متنوع
# شود و محدودسازی نرخ per-source دور زده شود. خالی = فقط از spoofed_ip استفاده شود.
# فقط وقتی no_spoof = false معنا دارد. مثال: ["203.0.113.201", "203.0.113.202"]
spoofed_ip_pool = []

# با true جعل خاموش می‌شود: اعتبارسنج spoofed_ip = real_ip و
# peer_spoofed_ip = peer_real_ip را اجبار می‌کند. برای شروعِ امن پیش‌فرض true است.
# برای فعال‌کردن جعل، این را false کنید و spoofed_ip/peer_spoofed_ip را پر کنید.
no_spoof = true


# -----------------------------------------------------------------------------
# [transport] — انتقال‌های روی سیم و انتخاب نقطه‌ی اتصال
# -----------------------------------------------------------------------------
[transport]
# کارت شبکه‌ی فیزیکی که سوکت خام به آن bind می‌شود (مثلاً eth0).
interface = "eth0"

# انتقال مسیر بالارو (client → server). یکی از:
#   udp | icmp | proto58 | tcp | quic | ipip | gre
# باید با همان مقدار در فایل کلاینت یکسان باشد.
uplink_protocol = "udp"

# انتقال مسیر پایین‌رو (server → client). می‌تواند با uplink متفاوت باشد.
# نکته: quic جعل را نمی‌پذیرد (باید no_spoof = true باشد)؛ mux و FEC فقط روی
# udp/icmp/proto58/ipip کار می‌کنند.
downlink_protocol = "udp"

# پورت L4 برای انتقال‌های udp/tcp/quic. باید در هر دو طرف یکسان باشد.
data_port = 51820

# چرخاندن پورت داده روی زمان‌بندی (فقط udp/tcp، هرگز با quic). پیش‌فرض خاموش.
shuffle_data_port = false

# کف و سقف بازه‌ی پورت هنگام shuffle (وقتی shuffle_data_port = true).
shuffle_port_min = 20000
shuffle_port_max = 60000

# شناسه‌ی ICMP Echo برای انتقال icmp. (۴۶۶۰ معادل 0x1234 است.)
icmp_id = 4660

# تصادفی‌کردن icmp_id در هر نشست تا با ترافیک واقعی ping مخلوط شود.
randomize_icmp_id = true

# نقاط اتصال سرور که اپراتور کنترل می‌کند و بین آن‌ها hop انجام می‌شود (ip:port).
# اولی اصلی است. خالی = یک نقطه از peer_real_ip:data_port ساخته می‌شود.
# سمت سرور معمولاً خالی می‌ماند (سرور listen می‌کند). مثال: ["203.0.113.10:51820"]
server_endpoints = []

# فاصله‌ی ثانیه‌ای بین hopِ نقطه/پورت (۰ = خاموش). برای >۰ حداقل دو
# server_endpoints لازم است.
endpoint_hop_interval_secs = 0

# مسابقه‌ی همه‌ی انتقال‌ها هنگام شروع و نگه‌داشتن سریع‌ترین؛ بقیه کاندیدای failover
# می‌شوند.
transport_racing = false

# فهرست مرتب failover؛ موتور هنگام مسدودشدن/افت به مورد بعدی سقوط می‌کند.
# مثال: failover_order = ["icmp", "tcp"]
failover_order = []


# -----------------------------------------------------------------------------
# [crypto] — handshake، AEAD، rekey، پساکوانتومی
# -----------------------------------------------------------------------------
[crypto]
# کلید خصوصی استاتیک Noise (X25519) همین میزبان، base64.
# با `freespoof genkey` بسازید و این‌جا بگذارید. خالی‌ماندن خطا می‌دهد.
static_private_key = "<RUN: freespoof genkey>"

# کلید عمومی استاتیک همین میزبان، base64 (اطلاعاتی). خروجی همان genkey.
# این کلید را به peer_public_key فایلِ کلاینت بدهید.
static_public_key = "<RUN: freespoof genkey>"

# کلید عمومی استاتیک طرف مقابل (کلاینت)، base64 — برای handshake نوع Noise_IK لازم.
# این مقدار را از static_public_key فایلِ کلاینت کپی کنید.
peer_public_key = "<RUN: freespoof genkey  (کلید عمومی کلاینت)>"

# لایه‌ی متقارنِ اضافی و اختیاری که در handshake ترکیب می‌شود (مانند WireGuard،
# نوع IKpsk2). base64 یا عبارت عبور؛ خالی = بدون PSK. اگر تنظیم شود باید در هر دو
# طرف دقیقاً یکسان باشد. مثال: pre_shared_key = "<یک رشته‌ی مخفی مشترک>"
pre_shared_key = ""

# AEAD هر فریم. یکی از: chacha20_poly1305 | aes256_gcm
# در هر دو طرف باید یکسان باشد.
aead = "chacha20_poly1305"

# انتخاب خودکار aes256_gcm وقتی CPU از AES-NI پشتیبانی می‌کند.
aead_auto_hardware = true

# فعال‌کردن handshake ترکیبیِ پساکوانتومی X25519 + ML-KEM.
pq_hybrid = true

# مجموعه‌پارامتر ML-KEM برای حالت ترکیبی. یکی از: ml_kem512 | ml_kem768 | ml_kem1024
pq_level = "ml_kem768"

# rekey بعد از این تعداد بایت در یک نشست (۰ = خاموش). پیش‌فرض ۶۴ گیبی‌بایت.
rekey_bytes = 68719476736

# rekey بعد از این تعداد ثانیه در یک نشست (۰ = خاموش). باید ۰ یا >=۱۰ باشد.
rekey_secs = 3600

# پهنای پنجره‌ی لغزانِ ضدبازپخش (anti-replay) بر حسب فریم. باید مضربی از ۶۴ و >=۶۴.
replay_window = 2048


# -----------------------------------------------------------------------------
# [tun] — دستگاه TUN، مسیریابی، NAT و فایروال
# -----------------------------------------------------------------------------
[tun]
# نام رابط TUN (حداکثر ۱۵ کاراکتر).
tun_name = "freespoof0"

# آدرس TUN این طرف (لینک نقطه‌به‌نقطه /30). بین دو طرف جابه‌جا می‌شود.
# سرور: 10.66.0.1  —  کلاینت: 10.66.0.2
tun_ip = "10.66.0.1"

# آدرس TUN طرف مقابل. بین دو طرف جابه‌جا می‌شود.
tun_peer_ip = "10.66.0.2"

# نت‌ماسک TUN (لینک نقطه‌به‌نقطه از /30 استفاده می‌کند).
tun_netmask = "255.255.255.252"

# MTU داخلی روی دستگاه TUN؛ به mtu موتور ([perf].mtu) کلمپ می‌شود. حداقل ۵۷۶.
tun_mtu = 1380

# پورت‌هایی که به tun_peer_ip ترجمه/فوروارد می‌شوند (TCP+UDP). خالی = همه‌ی پورت‌ها.
# مثال: forward_ports = [80, 443]
forward_ports = []

# حالت مسیریابی: full (همه‌ی ترافیک از تونل) یا split (فقط CIDR/پورت‌های تعیین‌شده).
routing_mode = "full"

# CIDRهای حالت split (وقتی routing_mode = "split"). مثال: ["10.0.0.0/8", "192.168.0.0/16"]
split_cidrs = []

# پورت‌های حالت split. مثال: split_ports = [443]
split_ports = []

# DNSهایی که برای تونل push/override می‌شوند.
dns_servers = ["1.1.1.1", "9.9.9.9"]

# حل نام‌های خودِ تونل روی DoH/DoT.
dns_over_https = false

# نصب kill switch تا با افتادن تونل، ترافیک از روی NIC نشت نکند.
kill_switch = true


# -----------------------------------------------------------------------------
# [obfs] — مبهم‌سازی در برابر DPI، تقلید و شکل‌دهی ترافیک
# -----------------------------------------------------------------------------
[obfs]
# حداقل بایت padding تصادفی که به هر فریم افزوده می‌شود (۰ = خاموش).
packet_padding = 0

# سقف padding تصادفی (در هر فریم عددی در بازه‌ی ۱..=max انتخاب می‌شود).
packet_padding_max = 64

# مقادیر TTL که به‌صورت تصادفی per-packet انتخاب می‌شوند (باید در دو طرف یکسان و
# همگی غیرصفر باشند).
ttl_jitter = [64, 128, 255]

# افزودن یک هدر جعلیِ ۵ بایتیِ TLS Application-Data روی انتقال tcp.
fake_tls_header = false

# کدهای DSCP که per-packet تصادفی انتخاب می‌شوند. (0 و 40 و 16 معادل 0x00/0x28/0x10)
random_dscp = [0, 40, 16]

# سقف jitter زمان‌بندی بین بسته‌ها (میلی‌ثانیه، ۰ = خاموش).
timing_jitter_ms = 0

# شکل‌دهی با نرخ ثابت: ارسال با آهنگ ثابتِ بسته (packets per second، ۰ = خاموش).
constant_rate_pps = 0

# پر کردن هر فریم تا این اندازه‌ی ثابت (۰ = خاموش). اگر >۰ باشد باید >=۶۴.
pad_to_size = 0

# نمای تقلید توزیع طول. یکی از: none | http2 | http3 | doh | web_socket | video_stream
mimicry_profile = "none"

# اثرانگشت TLS برای تقلید روی tcp/quic. یکی از: chrome | firefox | safari | native
tls_fingerprint = "chrome"

# SNI که انتقال‌های tcp/quic ارائه می‌کنند.
sni = "www.cloudflare.com"

# استفاده از Encrypted Client Hello برای پنهان‌کردن SNI واقعی (در صورت پشتیبانی).
ech = false

# ترافیک پوششی/chaff برای پنهان‌کردن الگوی مصرف (packets per second، ۰ = خاموش).
cover_traffic_pps = 0

# طعمه در برابر کاوش فعال (active probing): ترافیکِ احرازنشده به یک سایت واقعی
# HTTPS پراکسی‌معکوس می‌شود تا کاوشگر یک وب‌سایت معتبر ببیند (سبک Reality/Trojan).
# بیشتر در سمت سرور کاربرد دارد.
decoy_enabled = false

# مقصد بالادستِ طعمه به‌صورت host:port برای پراکسی معکوس. وقتی decoy_enabled = true
# حتماً باید تنظیم شود.
decoy_target = "www.cloudflare.com:443"

# آدرسی که پراکسیِ طعمه روی آن گوش می‌دهد (ip:port، سمت سرور). خالی = از real_ip:443
# ساخته می‌شود. مثال: decoy_listen = "203.0.113.10:443"
decoy_listen = ""


# -----------------------------------------------------------------------------
# [mux] — دسته‌بندی/بسته‌بندی بسته‌ها (فقط روی udp/icmp/proto58/ipip)
# -----------------------------------------------------------------------------
[mux]
# فعال‌کردن multiplex (batching).
enable_multiplex = false

# تخلیه‌ی دسته بعد از این میلی‌ثانیه حتی اگر پر نشده باشد.
multiplex_flush_ms = 1

# حداکثر بایت payload در هر فریم روی سیم هنگام batching. اگر enable_multiplex
# روشن باشد باید >=۲۵۶ باشد.
multiplex_max_payload = 1200


# -----------------------------------------------------------------------------
# [fec] — تصحیح خطای رو به جلو (فقط روی udp/icmp/proto58/ipip)
# -----------------------------------------------------------------------------
[fec]
# فعال‌کردن FEC.
enable_fec = false

# تعداد shardهای داده در هر گروه FEC (باید >=۲).
fec_group_size = 8

# الگوریتم FEC. یکی از: xor (تک‌پاریتی، سبک) | reed_solomon (چندخطا).
fec_mode = "reed_solomon"

# تطبیق میزان افزونگی با نرخ اتلاف اندازه‌گیری‌شده.
fec_adaptive = true

# تعداد shardهای پاریتی در حالت reed_solomon (باید >=۱؛ data+parity <= ۲۵۵).
fec_parity_shards = 2


# -----------------------------------------------------------------------------
# [perf] — موازی‌سازی، تنظیم خودکار و بافرها
# -----------------------------------------------------------------------------
[perf]
# تعداد جریان‌های تونلِ موازی و مستقل (با auto_tune بازنویسی می‌شود). اگر
# auto_tune = false باشد باید >=۱.
tunnel_count = 4

# تشخیص CPU/RAM/NIC و تنظیم خودکار نخ‌ها، تعداد تونل و ظرفیت‌ها.
auto_tune = true

# نمای کارایی برای auto-tuner. یکی از: throughput | latency | balanced
perf_mode = "balanced"

# MTU مؤثر موتور (سقفِ کلمپ برای همه‌ی لایه‌های داخلی). بازه‌ی مجاز ۵۷۶..=۹۰۰۰.
mtu = 1380

# ظرفیت کانال‌های داخلی. غیرصفر.
channel_capacity = 1024
io_channel_capacity = 2048

# تعداد نخ‌های کارگر Tokio (۰ = خودکار / برابر تعداد هسته‌ها).
runtime_worker_threads = 0

# پین‌کردن نخ‌های کارگر به CPUها در توان‌عبوری بالا (بهترین تلاش).
cpu_pinning = false

# استفاده از backend نوع io_uring در صورت وجود (بهترین تلاش؛ در غیر این‌صورت
# fallback می‌کند).
io_uring = false


# -----------------------------------------------------------------------------
# [reliability] — کنترل ازدحام، keepalive، migration و اتصال مجدد
# -----------------------------------------------------------------------------
[reliability]
# کنترل‌کننده‌ی ازدحام روی مسیرهای سفارشی (غیر QUIC). یکی از: bbr | aimd | none
congestion = "bbr"

# فاصله‌ی keepalive/heartbeat بر حسب ثانیه (۰ = خاموش).
keepalive_secs = 15

# اعلام مرگ همتا پس از این تعداد ثانیه بدون ترافیک.
dead_peer_timeout_secs = 60

# اتصال مجدد خودکار با backoff نمایی هنگام افتادن تونل.
auto_reconnect = true

# کف و سقف backoff اتصال مجدد (میلی‌ثانیه).
reconnect_backoff_min_ms = 500
reconnect_backoff_max_ms = 30000

# بقا در برابر تغییر IP کلاینت (مثلاً Wi-Fi <-> cellular) بر پایه‌ی session id.
enable_migration = true


# -----------------------------------------------------------------------------
# [observability] — متریک، سوکت کنترل و لاگ‌ها
# -----------------------------------------------------------------------------
[observability]
# آدرس گوش‌دادن Prometheus روی /metrics (خالی = غیرفعال).
# برای امنیت به localhost محدود شده است.
metrics_addr = "127.0.0.1:9100"

# آدرس گوش‌دادن سلامت روی /health (خالی = غیرفعال).
health_addr = "127.0.0.1:9101"

# سوکت یونیکسِ کنترل برای CLI مدیریتی `freespoof ctl` (خالی = غیرفعال).
control_socket = "/run/freespoof.sock"

# چاپ لاگ‌های ساخت‌یافته‌ی JSON در کنار لاگ‌های خوانا.
json_logs = false

# سمت سرور: حداکثر تلاش handshake به‌ازای هر IP مبدأ در هر دقیقه.
handshake_rate_limit = 30


# -----------------------------------------------------------------------------
# [quic] — تنظیمات ویژه‌ی انتقال QUIC (فقط وقتی uplink/downlink = quic)
# -----------------------------------------------------------------------------
# یادآوری: QUIC با جعل IP ترکیب نمی‌شود؛ برای QUIC باید spoof.no_spoof = true باشد.
# اگر cert_path/key_path موجود نباشد، freespoof به‌طور خودکار یک گواهی موقتِ
# self-signed می‌سازد.
[quic]
# مسیر زنجیره‌ی گواهی PEM (سمت سرور).
cert_path = "/etc/freespoof/quic-cert.pem"

# مسیر کلید خصوصی PEM (سمت سرور).
key_path = "/etc/freespoof/quic-key.pem"

# نام سروری که کلاینت اعتبارسنجی می‌کند / سرور ارائه می‌دهد.
server_name = "www.cloudflare.com"

# پنجره‌ی کنترل جریان در سطح اتصال (بایت). پیش‌فرض ۱۲۸ مگابایت.
connection_window = 134217728

# پنجره‌ی کنترل جریان در سطح هر stream (بایت). پیش‌فرض ۱۶ مگابایت.
stream_window = 16777216


# -----------------------------------------------------------------------------
# [hardening] — افت امتیاز (privilege drop) و sandbox
# -----------------------------------------------------------------------------
[hardening]
# پس از گرفتن caps/سوکت‌ها/فایروال، به این کاربر افت می‌کند (خالی = بدون افت).
# مثال: run_as_user = "freespoof"
run_as_user = ""

# افت به این گروه پس از راه‌اندازی (خالی = از روی کاربر استنتاج می‌شود).
run_as_group = ""

# اعمال sandbox سیستم‌فایل با Landlock پس از init (بهترین تلاش). دسترسی فایل را
# به مسیرهای لازم محدود می‌کند؛ هسته‌ی فاقد Landlock فقط log و رد می‌شود (fatal نیست).
sandbox = false

# نصب deny-list فراخوان‌های سیستمی با seccomp-bpf پس از افت امتیاز (بهترین تلاش).
# فراخوان‌های خطرناک (ptrace، بارگذاری ماژول، mount، kexec، bpf، keyring و …) با
# EPERM رد می‌شوند؛ هرگز پروسه را نمی‌کشد و هسته‌ی فاقد seccomp فقط log و رد می‌شود.
seccomp = false
