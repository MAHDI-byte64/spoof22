[toolchain]
# freespoof targets stable Rust. The dependency tree requires rustc >= 1.89
# (edition2024 + newer deps such as aes 0.9), so build with a recent stable.
# `rustfmt` and `clippy` are required for the quality gates.
channel = "stable"
components = ["rustfmt", "clippy"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]
