# Configuration for `cross` (https://github.com/cross-rs/cross), used by the CI
# cross-build matrix. The default cross images already ship a C toolchain, which
# the `ring` crypto backend needs; no extra packages are required for a build.
[build]
default-target = "x86_64-unknown-linux-gnu"

[build.env]
passthrough = ["RUSTFLAGS"]
